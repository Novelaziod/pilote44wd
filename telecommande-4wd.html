<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14171c">
<title>Pilote 4WD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : console de pilotage plein écran — statut en haut, croix directionnelle au centre, vitesse + modes en bas */
:root{
  --bg:#14171c; --panel:#1d2128; --key:#272c35; --key-hi:#323946;
  --fg:#e8ebf0; --muted:#8b93a1; --accent:#ffb020; --stop:#ff4d4d; --ok:#3ddc84;
  --display:"Chakra Petch", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#eef0f3; --panel:#ffffff; --key:#e2e5ea; --key-hi:#d3d8df;
    --fg:#161a20; --muted:#5d6572; --accent:#c77a00; --stop:#d92b2b; --ok:#16a35a; color-scheme:light; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono);
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex; flex-direction:column; gap:14px;
  user-select:none; -webkit-user-select:none; touch-action:manipulation; overscroll-behavior:none;
}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;margin:0}
.status{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.connect{
  width:100%; padding:14px; border-radius:12px; background:var(--accent); color:#14171c;
  font-family:var(--display); font-weight:700; font-size:1rem; letter-spacing:.08em; text-transform:uppercase;
}
.on .connect{background:var(--key);color:var(--fg)}
.msg{font-size:.78rem;color:var(--muted);min-height:1.2em;margin:0}
.msg.err{color:var(--stop)}

.pad{flex:1;display:grid;place-items:center;min-height:0}
.dpad{
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:10px;
  width:min(86vw,46vh,360px); aspect-ratio:1; max-width:100%;
}
.k{
  background:var(--key); border-radius:18px; display:grid; place-items:center;
  font-family:var(--display); font-weight:700; font-size:.85rem; letter-spacing:.06em; color:var(--muted);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); transition:transform .06s, background .06s;
}
.k svg{width:44%;height:44%;fill:var(--fg)}
.k.down{background:var(--accent);transform:translateY(2px);box-shadow:none;color:#14171c}
.k.down svg{fill:#14171c}
.k.stop{background:var(--stop);color:#fff;border-radius:50%;font-size:1rem}
.k.stop.down{filter:brightness(.85)}
.k:disabled{opacity:.35}
.blank{visibility:hidden}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.speed{background:var(--panel);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.speed .label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);flex:1}
.speed .label b{display:block;font-family:var(--display);font-size:1.4rem;color:var(--fg);letter-spacing:0;font-variant-numeric:tabular-nums}
.sbtn{width:48px;height:48px;border-radius:12px;background:var(--key);font-family:var(--display);font-size:1.4rem;font-weight:700}
.sbtn.down{background:var(--accent);color:#14171c}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{
  background:var(--panel); border-radius:12px; padding:10px 4px; font-size:.68rem; line-height:1.2; text-align:center;
  border:2px solid transparent; display:flex;flex-direction:column;align-items:center;gap:4px;
}
.mode i{font-style:normal;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--accent)}
.mode.active{border-color:var(--accent)}
.mode:disabled,.sbtn:disabled{opacity:.35}
.foot{font-size:.7rem;color:var(--muted);text-align:center;margin:0}
.foot code{color:var(--fg)}
</style>
</head>
<body>
<header>
  <h1>Pilote 4WD</h1>
  <div class="status" id="status"><span class="dot"></span><span id="statusTxt">Déconnecté</span></div>
</header>

<div>
  <button class="connect" id="connect">Connecter la voiture</button>
  <p class="msg" id="msg">Allume la voiture (interrupteur sur ON), puis appuie sur Connecter.</p>
</div>

<div class="pad">
  <div class="dpad">
    <span class="blank"></span>
    <button class="k" data-cmd="F" aria-label="Avancer"><svg viewBox="0 0 24 24"><path d="M12 4l8 10H4z"/></svg></button>
    <span class="blank"></span>
    <button class="k" data-cmd="L" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M4 12l10-8v16z"/></svg></button>
    <button class="k stop" id="stop" aria-label="Stop">STOP</button>
    <button class="k" data-cmd="R" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M20 12L10 4v16z"/></svg></button>
    <span class="blank"></span>
    <button class="k" data-cmd="B" aria-label="Reculer"><svg viewBox="0 0 24 24"><path d="M12 20L4 10h16z"/></svg></button>
    <span class="blank"></span>
  </div>
</div>

<div class="speed">
  <button class="sbtn" data-hold="d" aria-label="Ralentir">−</button>
  <div class="label">Vitesse (maintenir)<b id="spd">150 / 255</b></div>
  <button class="sbtn" data-hold="a" aria-label="Accélérer">+</button>
</div>

<div class="modes">
  <button class="mode" data-mode="U"><i>U</i>Suivre la main</button>
  <button class="mode" data-mode="Y"><i>Y</i>Éviter obstacles</button>
  <button class="mode" data-mode="X"><i>X</i>Suivre ligne</button>
  <button class="mode" data-mode="G"><i>G</i>Rester dans le cercle</button>
</div>

<p class="foot">Chrome Android · module BLE <code>FFE0/FFE1</code> · programme Projet 17</p>

<script>
const SERVICE = 0xffe0, CHAR = 0xffe1;
let device = null, ch = null, queue = Promise.resolve(), speed = 150, held = null, activeMode = null;
const $ = s => document.querySelector(s);
const msg = (t, err) => { $('#msg').textContent = t; $('#msg').classList.toggle('err', !!err); };

function setConnected(on){
  document.body.classList.toggle('on', on);
  $('#statusTxt').textContent = on ? (device?.name || 'Connecté') : 'Déconnecté';
  $('#connect').textContent = on ? 'Déconnecter' : 'Connecter la voiture';
  document.querySelectorAll('[data-cmd],[data-hold],[data-mode]').forEach(b => b.disabled = !on);
  if (!on) setMode(null);
}

// Envoi série : un caractère à la fois, dans l'ordre
function send(c){
  if (!ch) return;
  const data = new TextEncoder().encode(c);
  queue = queue.then(() =>
    (ch.writeValueWithoutResponse ? ch.writeValueWithoutResponse(data) : ch.writeValue(data))
  ).catch(e => msg('Envoi impossible : ' + e.message, true));
}

$('#connect').onclick = async () => {
  if (device?.gatt?.connected){ send('S'); setTimeout(()=>device.gatt.disconnect(),150); return; }
  if (!navigator.bluetooth){ msg('Web Bluetooth indisponible. Ouvre cette page dans Chrome, via une adresse https://.', true); return; }
  try{
    msg('Choisis le module dans la liste (souvent « BT04-A », « HMSoft » ou « BLE »)…');
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[SERVICE] });
    device.addEventListener('gattserverdisconnected', () => { ch = null; setConnected(false); msg('Connexion perdue. Appuie sur Connecter pour reprendre.', true); });
    msg('Connexion…');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(SERVICE);
    ch = await svc.getCharacteristic(CHAR);
    setConnected(true); send('S');
    msg('Prêt. Maintiens une flèche pour rouler, relâche pour t\'arrêter.');
    try{ await navigator.wakeLock?.request('screen'); }catch(e){}
  }catch(e){
    if (e.name === 'NotFoundError') msg('Aucun appareil choisi.');
    else msg('Échec : ' + e.message + ' — le module n\'utilise peut-être pas le service FFE0.', true);
    setConnected(false);
  }
};

function setMode(m){
  activeMode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
}

// Boutons à maintenir : envoi à l'appui, 'S' au relâchement
function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', e => {
    if (el.disabled) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add('down'); held = el; onDown();
  });
  const up = () => { if (!el.classList.contains('down')) return; el.classList.remove('down'); held = null; onUp(); };
  ['pointerup','pointercancel','lostpointercapture'].forEach(t => el.addEventListener(t, up));
}

document.querySelectorAll('[data-cmd]').forEach(b =>
  bindHold(b, () => { setMode(null); send(b.dataset.cmd); }, () => send('S')));

let spdTimer = null;
document.querySelectorAll('[data-hold]').forEach(b =>
  bindHold(b, () => {
    setMode(null); const c = b.dataset.hold; send(c);
    // estimation locale : l'Arduino change la vitesse d'environ 1 cran / 10 ms
    spdTimer = setInterval(() => { speed = Math.max(0, Math.min(255, speed + (c==='a'?4:-4))); $('#spd').textContent = speed + ' / 255'; }, 40);
  }, () => { clearInterval(spdTimer); send('S'); }));

const stop = $('#stop');
bindHold(stop, () => { setMode(null); send('S'); }, () => {});

document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  if (activeMode === b.dataset.mode){ send('S'); setMode(null); return; }
  send('S'); setTimeout(() => send(b.dataset.mode), 80); setMode(b.dataset.mode);
});

// Sécurité : arrêt si l'appli passe en arrière-plan
document.addEventListener('visibilitychange', () => { if (document.hidden){ send('S'); setMode(null); } });
document.addEventListener('contextmenu', e => e.preventDefault());

setConnected(false);
</script>
</body>
</html>
